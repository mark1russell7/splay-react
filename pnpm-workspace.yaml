# Packages allowed to run install scripts. Since pnpm 11 every other package that has one fails the install.
allowBuilds:
  esbuild: true
# pnpm 12 does not install a version that is younger than its minimum release age. cue 1.0.2 and
# splay 0.2.0 are new, so pnpm added them here. Remove each entry when the version is old enough.
minimumReleaseAgeExclude:
  - '@mark1russell7/cue@1.0.2'
  - '@mark1russell7/splay@0.2.0'
