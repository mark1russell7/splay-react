<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>splay-react: render data to JSON, hydrate it to React</title>
    <meta
      name="description"
      content="A live demo of splay-react. Edit data, change a viewer, and see the two phases: the serializable ComponentOutput and the React elements that it hydrates to."
    />
    <meta name="color-scheme" content="light dark" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23141a24'/%3E%3Ccircle cx='8' cy='16' r='3.5' fill='%23e3a33b'/%3E%3Ccircle cx='16' cy='16' r='3.5' fill='%2334b88a'/%3E%3Ccircle cx='24' cy='16' r='3.5' fill='%2358a6ff'/%3E%3C/svg%3E"
    />
    <script>
      // The saved theme applies before the first paint, so a dark page does not flash white.
      try {
        const t = localStorage.getItem("splay-react-theme");
        if (t === "light" || t === "dark") document.documentElement.dataset.theme = t;
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript><p class="noscript">The demo of this page needs JavaScript. The code is at github.com/mark1russell7/splay-react.</p></noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
